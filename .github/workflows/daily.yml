name: Daily Trilingual Digest Auto Generator

on:
  schedule:
    - cron: '37 22 * * *' # UTC 22:37 = 台灣時間每天早上 06:37
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊按鈕立即測試執行

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai edge-tts requests beautifulsoup4 pytz

      - name: Generate daily news and MP3 audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python generate.py

      - name: Send LINE Notification
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          LINE_GROUP_IDS: ${{ secrets.LINE_GROUP_IDS }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python send_line_notification.py

      - name: Commit and push updates
        run: |
          git config user.name "Daily Digest Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update daily digest" && git push)
